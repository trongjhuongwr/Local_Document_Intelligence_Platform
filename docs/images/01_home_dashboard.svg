<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  
  <!-- App Container Mockup -->
  <g transform="translate(60, 40)" filter="url(#shadow)">
    <rect width="1080" height="595" rx="16" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Topbar -->
    <rect width="1080" height="48" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="28" cy="24" r="6" fill="#ef4444"/>
    <circle cx="46" cy="24" r="6" fill="#f59e0b"/>
    <circle cx="64" cy="24" r="6" fill="#10b981"/>
    <text x="540" y="29" fill="#64748b" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Document Intelligence &amp; Cross-Verification Platform</text>
    
    <!-- Sidebar -->
    <rect x="0" y="48" width="220" height="547" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="16" y="68" width="28" height="28" rx="8" fill="#0f172a"/>
    <text x="24" y="86" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="16">✦</text>
    <text x="54" y="80" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">DocIntelligence</text>
    <text x="54" y="93" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Local Audit Platform</text>

    <!-- Nav links -->
    <rect x="12" y="125" width="196" height="34" rx="8" fill="#f1f5f9"/>
    <text x="32" y="147" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="600">🏠 Home Workspace</text>
    <text x="32" y="182" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">📁 Cases &amp; Packs</text>
    <text x="32" y="217" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">💬 Ask Documents</text>
    <text x="32" y="252" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">⚖️ Review Findings (10)</text>
    <text x="32" y="297" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">📊 Benchmark Eval</text>

    <!-- Content Area -->
    <g transform="translate(250, 75)">
      <text x="0" y="20" fill="#0f172a" font-family="system-ui, sans-serif" font-size="22" font-weight="800">Review document packs with evidence, not guesswork</text>
      <text x="0" y="42" fill="#64748b" font-family="system-ui, sans-serif" font-size="13">Traceable cross-document anomaly detection across MSA contracts, POs, Invoices, and AP policies.</text>
      
      <!-- Action Buttons -->
      <rect x="0" y="60" width="120" height="36" rx="8" fill="#0f172a"/>
      <text x="60" y="83" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">+ Create case</text>
      
      <rect x="132" y="60" width="135" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="200" y="83" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">✨ Try sample case</text>

      <!-- 4 Steps Banner -->
      <g transform="translate(0, 120)">
        <rect x="0" y="0" width="185" height="90" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
        <text x="14" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="700">STEP 1</text>
        <text x="14" y="44" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Create case</text>
        <text x="14" y="62" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Give the audit review a</text>
        <text x="14" y="75" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">clear business name.</text>

        <rect x="195" y="0" width="185" height="90" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
        <text x="209" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="700">STEP 2</text>
        <text x="209" y="44" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Add document pack</text>
        <text x="209" y="62" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Upload contract, invoice,</text>
        <text x="209" y="75" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">purchase order, policy.</text>

        <rect x="390" y="0" width="185" height="90" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
        <text x="404" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="700">STEP 3</text>
        <text x="404" y="44" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Analyze discrepancies</text>
        <text x="404" y="62" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">12 deterministic checks</text>
        <text x="404" y="75" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">and constraint rules.</text>

        <rect x="585" y="0" width="195" height="90" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
        <text x="599" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="700">STEP 4</text>
        <text x="599" y="44" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Review findings</text>
        <text x="599" y="62" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Approve / Reject finding</text>
        <text x="599" y="75" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">with full audit logging.</text>
      </g>

      <!-- Case List -->
      <g transform="translate(0, 230)">
        <text x="0" y="16" fill="#0f172a" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Recent Audit Cases</text>

        <rect x="0" y="28" width="780" height="52" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
        <text x="18" y="52" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Acme Analytics Q1 2026 Audit Review</text>
        <text x="18" y="67" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">4 documents · Updated 2026-08-23</text>
        <rect x="540" y="42" width="60" height="22" rx="6" fill="#ecfdf5"/>
        <text x="570" y="57" fill="#059669" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Ready</text>
        <text x="615" y="57" fill="#d97706" font-family="system-ui, sans-serif" font-size="11" font-weight="600">5 open findings</text>

        <rect x="0" y="88" width="780" height="52" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
        <text x="18" y="112" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="700">CloudScale Infrastructure - Annual Cloud Hosting (Compliant)</text>
        <text x="18" y="127" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">4 documents · Updated 2026-08-23</text>
        <rect x="540" y="102" width="60" height="22" rx="6" fill="#ecfdf5"/>
        <text x="570" y="117" fill="#059669" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Ready</text>
        <text x="615" y="117" fill="#059669" font-family="system-ui, sans-serif" font-size="11" font-weight="600">100% Compliant</text>
      </g>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  
  <!-- App Container Mockup -->
  <g transform="translate(60, 40)" filter="url(#shadow)">
    <rect width="1080" height="595" rx="16" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Topbar -->
    <rect width="1080" height="48" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="28" cy="24" r="6" fill="#ef4444"/>
    <circle cx="46" cy="24" r="6" fill="#f59e0b"/>
    <circle cx="64" cy="24" r="6" fill="#10b981"/>
    <text x="540" y="29" fill="#64748b" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Document Intelligence Copilot &amp; Side Evidence Inspector</text>
    
    <!-- Left: Chat Area -->
    <g transform="translate(20, 65)">
      <rect width="680" height="510" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      
      <!-- Chat Header -->
      <rect width="680" height="50" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="20" y="30" fill="#0f172a" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Document Intelligence Copilot</text>
      <rect x="230" y="16" width="160" height="22" rx="11" fill="#fef3c7"/>
      <text x="310" y="31" fill="#92400e" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">● Gemini 3.7 Flash Grounded</text>
      
      <!-- User Message -->
      <rect x="240" y="70" width="420" height="40" rx="16" fill="#0f172a"/>
      <text x="260" y="94" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12">Do the invoice payment terms match the Master Services Agreement?</text>
      
      <!-- Bot Response -->
      <circle cx="40" cy="140" r="14" fill="#0f172a"/>
      <text x="34" y="145" fill="#fbbf24" font-size="14">✦</text>
      <rect x="70" y="125" width="590" height="230" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
      
      <rect x="85" y="138" width="200" height="22" rx="6" fill="#ecfdf5"/>
      <text x="95" y="153" fill="#059669" font-family="system-ui, sans-serif" font-size="10" font-weight="700">🛡️ Grounded in Audited Documents · 3552ms</text>
      
      <text x="85" y="185" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Acme Analytics Ltd (Master Services Agreement) — Mismatch</text>
      <text x="85" y="210" fill="#334155" font-family="system-ui, sans-serif" font-size="12">• Master Services Agreement: Specifies payment terms of <tspan font-weight="bold">Net 30</tspan> [1].</text>
      <text x="85" y="235" fill="#334155" font-family="system-ui, sans-serif" font-size="12">• Invoice (INV-2025-64282): Lists payment terms as <tspan font-weight="bold" fill="#dc2626">Net 60</tspan> [3].</text>
      <text x="85" y="260" fill="#334155" font-family="system-ui, sans-serif" font-size="12">• Compliance Note: Vertex AP Policy requires Net 30; deviation requires VP Finance sign-off [4].</text>
      
      <!-- Suggested Carousel -->
      <rect x="85" y="310" width="560" height="32" rx="8" fill="#f1f5f9"/>
      <text x="100" y="331" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="600">SUGGESTED FOLLOW-UP:  ‹  Are there any penalties for late deliverables?  ›</text>

      <!-- Input Box -->
      <rect x="20" y="420" width="640" height="70" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="35" y="450" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Ask a question about invoices, payment terms, contract maximums, or PO approvals...</text>
      <circle cx="630" cy="455" r="16" fill="#0f172a"/>
      <text x="625" y="460" fill="#ffffff" font-size="14">↑</text>
    </g>

    <!-- Right: Evidence Inspector -->
    <g transform="translate(715, 65)">
      <rect width="345" height="510" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
      
      <!-- Header -->
      <rect width="345" height="50" rx="12" fill="#0f172a"/>
      <text x="20" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">📖 Evidence &amp; Document Inspector</text>
      
      <!-- Citation Pill -->
      <rect x="20" y="65" width="85" height="24" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
      <text x="32" y="81" fill="#92400e" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Citation [1]</text>
      <text x="280" y="81" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Page 1</text>
      
      <text x="20" y="112" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="700">acme_master_services_agreement.pdf</text>
      <text x="20" y="128" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="600">SECTION: CONTRACT</text>
      
      <!-- Text snippet block -->
      <rect x="20" y="145" width="305" height="280" rx="8" fill="#fffbeb" stroke="#fde68a"/>
      <text x="35" y="175" fill="#92400e" font-family="monospace" font-size="11">"MASTER SERVICES AGREEMENT</text>
      <text x="35" y="195" fill="#92400e" font-family="monospace" font-size="11">BETWEEN: Acme Analytics Ltd</text>
      <text x="35" y="215" fill="#92400e" font-family="monospace" font-size="11">AND: Vertex Retail Corporation</text>
      <text x="35" y="235" fill="#92400e" font-family="monospace" font-size="11">EFFECTIVE DATE: 2025-01-15</text>
      <text x="35" y="255" fill="#92400e" font-family="monospace" font-size="11">MAXIMUM AMOUNT: $45,000.00</text>
      <text x="35" y="275" fill="#b45309" font-family="monospace" font-size="11" font-weight="bold">PAYMENT TERMS: Net 30</text>
      <text x="35" y="305" fill="#92400e" font-family="monospace" font-size="11">1. SCOPE: Provider shall furnish</text>
      <text x="35" y="325" fill="#92400e" font-family="monospace" font-size="11">data warehouse modeling..."</text>
      
      <rect x="20" y="440" width="305" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="172" y="463" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">📋 Copy Quote</text>
    </g>
  </g>
</svg>

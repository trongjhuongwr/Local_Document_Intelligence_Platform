name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy app evals synthetic_data mcp_server

      - name: Unit tests (no local models or database required)
        run: pytest -m "not ollama and not integration" -q

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: docintel
          POSTGRES_PASSWORD: docintel
          POSTGRES_DB: docintel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docintel -d docintel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://docintel:docintel@localhost:5432/docintel_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Create isolated test database and apply migrations
        run: |
          PGPASSWORD=docintel createdb -h localhost -U docintel docintel_test
          DATABASE_URL="$TEST_DATABASE_URL" alembic upgrade head

      - name: Integration tests (Postgres, no Ollama)
        run: pytest -m integration -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t docintel:ci .
